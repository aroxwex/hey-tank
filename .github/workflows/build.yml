name: Build HeyTank

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt pyinstaller

      - name: Ikon uret
        run: python tools/make_icon.py

      - name: exe derle
        run: >
          pyinstaller --noconfirm --noconsole --name HeyTank --icon assets/icon.ico
          --add-data "ui;ui"
          --hidden-import pystray._win32
          --collect-all webview --collect-all clr_loader --collect-all pythonnet
          --collect-all vosk --collect-all faster_whisper --collect-all ctranslate2
          --collect-all av --collect-all sounddevice --collect-all _sounddevice_data
          main.py

      - name: Modelleri indir
        run: python tools/fetch_models.py dist/HeyTank/models

      - name: Boyutu goster
        run: |
          $s = (Get-ChildItem dist/HeyTank -Recurse | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("Toplam: {0:N0} MB" -f $s)

      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: HeyTank-portable
          path: dist/HeyTank

      - name: Zip (sadece tag surumunde)
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path dist/HeyTank -DestinationPath HeyTank-portable.zip

      - name: Release olustur
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HeyTank-portable.zip
